<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Factorial</title>
</head>
<body>
    <script>
        var n = parseInt(prompt("Enter the number"))
        var fact =1;
        for(var i=1;i<=n;i++){
            fact = fact*i;
        }
        console.log(fact);
    </script>
</body>
</html>
