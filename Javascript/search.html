
<!DOCTYPE html>
<html>
<body>

<h2>JavaScript String Methods</h2>

<p>Search a string for "Mashupstack", and display the position of the match:</p>

<p id="demo"></p>

<script>
var str = "Visit Mashupstack!"; 
var n = str.search("Mashupstack");
document.getElementById("demo").innerHTML = n;
</script>

</body>
</html>
