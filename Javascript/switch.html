 
<!DOCTYPE html>
<html>
<body>

<h2>JavaScript Switch Statement</h2>

<script>
let x = "20";
switch (x) {
    case 20:
        x = 'one';
        break;
    case "20":
        x = 'two';
        break;
    default:
        x = 'not found';
        break;
}
console.log(`The value is ${x}`);

let player = 'Ganguly';
switch(player) {
    case 'Virat Kohli':
    case 'Ganguly':
    case 'Gautam Gambhir':
        console.log(`${player} is a Cricket player.`);
        break;
    default:
        console.log(`${player} is not a Cricket player.`);
        break;
}
</script>

</body>
</html>
