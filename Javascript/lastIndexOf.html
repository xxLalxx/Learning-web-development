
<!DOCTYPE html>
<html>
<body>

<h2>JavaScript Array.lastIndexOf()</h2>


<p id="demo"></p>

<script>
var flowers = ["Lotus", "Dahlia", "Lilly","Jasmine","Dahlia"];
var a = flowers.lastIndexOf("Dahlia");
document.getElementById("demo").innerHTML = "dahlia is found in position " + (a + 1);
</script>

<p>The lastIndexOf() does not work in Internet Explorer 8 and earlier versions.</p>

</body>
</html>
