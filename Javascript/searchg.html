
<!DOCTYPE html>
<html>
<body>

<p>Click the button to do a global search for "easy" in a string.</p>

<button onclick="myFunction()">Try it</button>

<p id="demo"></p>

<script>
function myFunction() {
  var str = "Javascript is easy. A walk in the park easy!";
  var pattern = /easy/g;
  var result = str.match(pattern);
  document.getElementById("demo").innerHTML = result;
}
</script>

</body>
</html>
