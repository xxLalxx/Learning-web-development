<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multiplication Table</title>
</head>
<body>
    <script>
        var n1=parseInt(prompt("Enter the number:"))
        for(var i=1;i<11;i++){
            console.log(`${n1}*${i}=${n1*i}`)
        }
    </script>
</body>
</html>
