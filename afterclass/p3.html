<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media</title>
    <style>
        #main{
            width:100vw;
            height:100vh;
            position: relative;
            
        }
        body{
            margin:0px;
            overflow:hidden;
        }
        #left{
            width:50%;
            height:100%;
            float:left;
            background: linear-gradient(10deg, rgba(243,214,175,1) 10%,
            rgba(132,152,237,1)93%);
        }
        #right{
             width:50%;
            height:100%;
            float:right;
            
        }
        .form{
            font-family: sans-serif;
            width:80%;
            margin-left:10%;
            margin-right:10%;
            height:50%;
            margin-top:250px;
        }
        [type="text"]{
            margin-top:5px;
            margin-bottom:5px;
            width:100%;
            box-sizing:border-box;
        }
        button{
            margin-top:5px;
            height:30px;
            width:100%;
        }
        label{
            font-weight:bold;
        }
        
        @media only screen and (max-width:600px){
            #left{
                display:none;
            }
            #right{
                width:100%;
            }
            .form {
                position: absolute;
                
            }
        }
    </style>
</head>
<body>
    <div id="main">
        <div id="left">
        </div>
        <div id="right">
            <form class="form">
                <h2 style="color:rgb(255,5,5)">Login Form</h2>
                <label for="email">Email :</label>
                <br>
                <input type="text" id="email" name="email">
                <br>
                <label for="pwd">Password:</label>
                <br>
                <input type="text" id="pwd" name="pwd">
                <br>
                <input type="checkbox" id="remember" name="remember">
                <label for="remember" style="font-weight: normal;">Remember Me</label>
                <br>
                <button style="background-color:rgb(255, 5, 5);color:#ffffff;border:none";>Login</button>
            </form>  
        </div>
    </div>
    
</body>
</html>
