<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            margin: 0px;
        }
        #main{
            background-color: aqua;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
        }
        

        @media only screen and (max-width:600px){
            #left{
                display: none;
            }
             #right{
            background-color: blueviolet;
            width:100%;
            height:100%;
            position: absolute;
        }
        form{
            background-color: bisque;
            width:50%;
            height:50%;
            margin-left: 25%;
            margin-top: 25%;
        }
        }
        @media only screen and (min-width:600px){
            #left{
            background-color: red;
            width: 50%;
            height: 100%;
            float:left;
        }
        #right{
            background-color: blueviolet;
            width:50%;
            height:100%;
            float:right;
        }
        form{
            background-color: bisque;
            width:50%;
            height:50%;
            margin-left: 25%;
            margin-top: 25%;
        }
        }
    </style>
</head>
<body>
    <div id="main">
        <div id="left"></div>
        <div id="right">
            <form action=""></form>
        </div>
    </div>
</body>
</html>
