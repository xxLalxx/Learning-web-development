<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Button question</title>
    <style>
              body{
                  background-color: beige;
              }

              a{
                  display: inline-block;
                  border: 1px solid green;
                  background-color: plum;
                  border-radius: 50%;
                  text-decoration: none;
                  width: 100px;
                  height: 100px;
                  text-align: center;
                  color: black;
                  line-height: 100px;
                  font-family:'Times New Roman', Times, serif;
                  font-size: x-large;
      /* to center the button in the middle */
                  position: absolute;
                  top: 50%;
                  left: 50%;
              }
      /*setting the opacity while hovering*/
              a:hover{
                  opacity: 0.7;
              }
    </style>
  </head>
  <body>
    <a href="https://github.com/xxLalxx">Press it</a>
  </body>
</html>
