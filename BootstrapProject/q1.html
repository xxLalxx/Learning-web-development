<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q1</title>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.0/css/bootstrap.min.css">
   <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
   <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.16.0/umd/popper.min.js"></script>
   <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.0/js/bootstrap.min.js"></script>
</head>
<body class="bg-primary">
    <div class="container bg-light mt-4">
        <br>
        <h2>Sign Up</h2>
        <p class="text-muted">Please fill this form to create an account</p>
        <form class="mt-4" >
            <div class="form-row d-flex flex-column flex-sm-row justify-content-between">
                <div class="col-12 col-sm-6 mb-3 mb-sm-0">
                    <input type="text" class="form-control" placeholder="First Name">
                </div>
                <div class="col-12 col-sm-6">
                    <input type="text" class="form-control" placeholder="Last Name">
                </div>
            </div>

            <div class="form-row mt-3">
            <div class="col-12">
                <input type="email" class="form-control" placeholder="Email">
            </div>
        </div>

        <div class="form-row mt-3">
            <div class="col-12">
                <input type="password" class="form-control" placeholder="Password">
            </div>
        </div>

        <div class="form-row mt-3">
            <div class="col-12">
                <input type="password" class="form-control" placeholder="Confirm Password">
            </div>
        </div>
        </form>
        <div class="form-group form-check  mt-3">
                <label class="form-check-label">
                <input class="form-check-input" type="checkbox" name="remember">I accept the <span class="text-primary">Terms of Use & Privacy Policy</span></input>
            </label>
        </div>  
        <button type="button" class="btn btn-primary col-12 col-sm-3 mb-4"><b>Sign Up</b></button>
        <br>
    </div>   
    <div class="container text-light mt-2" style="text-align: center;"> 
        Already have an acoount? 
        <a href="#" class="text-light">Login here</a>
    </div>
</body>
</html>
