<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lottery Draw</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <link rel="stylesheet" href="lottery.css">
</head>
<body>
    <div class="container design">
        <h2>Lottery Draw</h2>

        <button class="btn btn-primary" onclick="drawWinner()">Pick a Winner</button>

        <h3 id="winner">----Result-----</h3>

        <div class="modal fade" id="winnerModal">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title"> WINNER</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body text-primary">
                        <h2 id="modalWinner"></h2>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-danger" data-bs-dismiss="modal" >Close</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="lottery.js"></script>
</body>
</html>
